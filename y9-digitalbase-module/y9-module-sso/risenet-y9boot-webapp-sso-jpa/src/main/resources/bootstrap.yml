spring:
    profiles:
        active: local
    cloud:
        enabled: false
        nacos:
            config:
                enabled: false
                group: DEFAULT_GROUP
                namespace: ${NACOS_NAMESPACE:local}
                server-addr: ${NACOS_SERVER_ADDR:http://localhost:8848}
                username: ${NACOS_USERNAME:nacos}
                password: ${NACOS_PASSWORD:111111}
                extension-configs:
                    - dataId: sso.yml
---
spring:
    config:
        activate:
            on-profile: dev
    cloud:
        enabled: true
        nacos:
            config:
                enabled: true
                namespace: ${NACOS_NAMESPACE:dev}
                group: DEFAULT_GROUP
                server-addr: ${NACOS_SERVER_ADDR:https://dev.youshengyun.com:443}
                username: ${NACOS_USERNAME:nacos}
                password: ${NACOS_PASSWORD:111111}
                extension-configs:
                    - dataId: sso.yml
