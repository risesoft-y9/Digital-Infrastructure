<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="no-cache" http-equiv="pragma"/>
    <meta content="no-cache" http-equiv="cache-control"/>
    <meta content="0" http-equiv="expires"/>
    <!-- 管局要求保持备案名称和网站使用名称一致 -->
    <title></title>

    <link rel="stylesheet" th:href="@{/y9static/css/default.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/y9static/y9new/css/styles.css(v=1.2)}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/y9static/css/layerMsg.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/y9static/js/verify-img/css/verify.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/y9static/js/layui/css/layui.css}" type="text/css"/>

    <script charset="utf-8" th:src="@{/y9static/js/jquery/jquery-3.7.1.min.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/jquery/jquery.cookie.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/base64.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/forge.min.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/layui/layui.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/layerMsg.js}" type="text/javascript"></script>

    <script charset="utf-8" th:src="@{/y9static/js/webgl-cloud/ThreeWebGL.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/webgl-cloud/ThreeExtras.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/webgl-cloud/Detector.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/webgl-cloud/RequestAnimationFrame.js}" type="text/javascript"></script>
    <script charset="utf-8" th:src="@{/y9static/js/webgl-cloud/init.js}" type="text/javascript"></script>

    <script charset="utf-8" th:src="@{/y9static/js/verify-img/verify.js(v=1.4)}" type="text/javascript"></script>

</head>

<body>
<div class="logo logo--dynamic"><img alt="" id="logo-img" th:data-default-src="@{/y9static/images/cloud.png}"><span id="logo-name"></span></div>
<div class="login" id="tunnel">
    <div class="login_title">
        <span onclick="changeLoginType(0)">用户登录</span>
        <span></span>
        <span onclick="changeLoginType(1)">安信扫码</span>
    </div>
    <div class="qvcode">
        <a href="javascript:getQRCode();" id="img_container">
            <img th:src="@{/y9static/images/qrCodeTemp.jpg}"/>
        </a>
        <span id="error_msg"></span>
    </div>
    <div class="login_fields">
        <form method="post" id="fm1" th:object="${credential}">
            <div class="login_fields__tenant">
                <div class="icon"><img alt="" th:src="@{/y9static/images/tenant.png}"/></div>
                <select id="tenantShortName" name="tenantShortName">
                </select>
                <div class="validation"><img alt="" th:src="@{/y9static/images/tick.png}"/></div>
            </div>
            <div class="login_fields__user">
                <div class="icon"><img alt="" th:src="@{/y9static/images/username.png}"/></div>
                <input id="username" tabindex="1" placeholder="用户名" type="text" autocomplete="on" value=""/>
                <input id="username1" name="username" tabindex="1" autocomplete="off" htmlescape="true" type="hidden"/>
                <!-- <input id="tenantShortName" name="tenantShortName" autocomplete="false" htmlescape="true" type="hidden"/> -->
                <div class="validation"><img alt="" th:src="@{/y9static/images/tick.png}"/></div>
            </div>
            <div class="login_fields__password">
                <div class="icon"><img alt="" th:src="@{/y9static/images/password.png}"/></div>
                <input id="password" tabindex="2" type="password" htmlescape="true" autocomplete="on" placeholder="请输入您的密码"/>
                <input id="password1" name="password" htmlescape="true" autocomplete="off" type="hidden"/>
                <button class="password-toggle" type="button" aria-controls="password" aria-pressed="false"
                        aria-label="查看密码" title="查看密码" onclick="togglePasswordVisibility(this)">
                    <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line class="password-toggle-slash" x1="4" y1="4" x2="20" y2="20" visibility="hidden"/>
                    </svg>
                </button>
                <div class="validation"><img alt="" th:src="@{/y9static/images/tick.png}"/></div>
            </div>
            <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                登录失败：<span th:each="err : ${#fields.errors('*')}" th:utext="${err}"/>
            </div>
            <!-- 表单隐藏数据块开始 -->
            <input type="hidden" id="loginType" name="loginType" value="loginName"/>
            <input type="hidden" id="screenDimension" name="screenDimension" value=""/>
            <input type="hidden" id="rsaPublicKey" value=""/>
            <input type="hidden" name="execution" th:value="${flowExecutionKey}"/>
            <input type="hidden" name="_eventId" value="submit"/>
            <input type="hidden" name="geolocation"/>
            <!-- 表单隐藏数据块结束 -->
        </form>
        <!--点选验证码  -->
        <div id="mpanel6"></div>
        <div class="login_fields__submit">
            <input tabindex="3" type="button" value="登录"/>
        </div>
    </div>
    <div></div>
    <div class="linkOtherSystem">
        <a href="https://www.youshengyun.com/y9home/">云租户</a>
        <a href="https://www.youshengyun.com/y9DigitalBase/">云后台</a>
        <a href="https://www.risesoft.net">有生软件</a>
        <a href="https://www.zgcsa.net/" target="_blank">中关村软联</a>
    </div>
    <div class="success"></div>
    <div class="disclaimer">
        <p onclick="changeLoginModule(0)">登录<span class="related-system-highlight">「关联」</span>系统</p>
        <p onclick="changeLoginModule(1)">返回用户登录</p>
        <a href="https://www.youshengyun.com/baas/appstore/%E5%8D%8F%E4%BD%9C%E5%B9%B3%E9%9D%A25.0" target="_blank">安信下载</a>
    </div>
    <div class="toolTips">
        <ul id="toolTipsUl"></ul>
    </div>
</div>
<div class="footer">
    <div>
        <span>北京有生博大软件股份有限公司 版权所有</span>
        <a href="https://beian.miit.gov.cn/" target="_blank">京ICP备16060306号-4</a>
        <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=11010802026965" target="_blank"><img th:src="@{/y9static/images/police.png}"/>京公网安备11010802026965号</a>
    </div>
    <span>建议您使用1920x1080分辨率，IE9.0或以上版本浏览器访问本站，以获得最佳用户体验。 技术支持：0755-821072292</span>
</div>

<script type="text/javascript">
    //var ctx = "[(${contextPath})]";
    var ctx = "/sso";

    function togglePasswordVisibility(button) {
        var passwordInput = document.getElementById('password');
        var showPassword = passwordInput.type === 'password';
        passwordInput.type = showPassword ? 'text' : 'password';
        button.querySelector('.password-toggle-slash').setAttribute('visibility', showPassword ? 'visible' : 'hidden');
        button.setAttribute('aria-pressed', String(showPassword));
        button.setAttribute('aria-label', showPassword ? '隐藏密码' : '查看密码');
        button.setAttribute('title', showPassword ? '隐藏密码' : '查看密码');
    }

    $(function () {
        changeLoginType($.cookie("loginTip"));
        screenSize();
        initTenants();
    });

    function initTenants() {
        $.ajax({
            url: `${ctx}/api/allTenants`,
            type: 'GET',
            dataType: 'json',
            success: function (data) {
                $('#tenantShortName').empty();

                $.each(data, function (index, item) {
                    $('#tenantShortName').append(
                        $('<option></option>').val(item.tenantShortName).text(item.tenantName).attr('logo-icon', item.logoIcon).attr('description', item.description)
                    );
                });

                var tenantShortName = $.cookie("tenantShortName");
                if (tenantShortName) {
                    $("#tenantShortName").val(tenantShortName).trigger('change');
                }
            },
            error: function () {
                alert('获取数据失败');
            }
        });
    }

    $('#tenantShortName').on('change', function () {
        const option = $(this).find('option:selected');

        var logoImage = $("#logo-img");
        logoImage.attr("src", option.attr('logo-icon') || logoImage.attr("data-default-src")).show();
        if (option.attr('description')) {
            $('#logo-name').text(option.attr('description'));        
        } else {
            $('#logo-name').text('');
        }
        if (option.text()) {
            document.title = option.text();
        }
    });

    function screenSize() {
        try {
            $("#screenDimension").val(window.screen.width + '*' + window.screen.height);
        } catch (e) {
        }
    }

    $(document).keydown(function (e) {
        // 回车键事件
        if (e.which === 13) {
            $('input[type="button"]').click();
        }
    });
    
    //加密
    function rsaEncrypt(base64PublicKey, message) {
        const derBinary = forge.util.decode64(base64PublicKey);
        const asn1Obj = forge.asn1.fromDer(derBinary);
        const publicKey = forge.pki.publicKeyFromAsn1(asn1Obj);
        const messageBytes = forge.util.encodeUtf8(message);

        const encryptedBytes = publicKey.encrypt(messageBytes, 'RSA-OAEP', {
            md: forge.md.sha256.create()
        })
        return forge.util.encode64(encryptedBytes)
    }

    var open = 0;
    layui.use("layer", function () {
        var option = {
            type: "success",
            position: "top-center",
            showicon: true,
            time: 3000,
            title: "登录提示",
            content: "提示",
            shadow: false,
            shadowclickclose: true,
            autoclose: true,
            callback: function (data, obj) {
                obj.ele.close(0);
            },
        };
        //非空验证
        $('input[type="button"]').click(function () {
            var username = $('#username').val();
            var password = $('#password').val();
            var tenantShortName = $("#tenantShortName").val();
            if (username == "") {
                option.type = "warn";
                option.content = "请输入您的账号";
                WfMsg(option);
            } else if (password == "") {
                option.type = "warn";
                option.content = "请输入密码";
                WfMsg(option);
            } else {
                $.when(
                        $.ajax({
                            async: false,
                            cache: false,
                            type: "GET",
                            url: ctx + '/api/getRsaPublicKey',
                            dataType: "json",
                            success: function (y9Result) {
                                if (y9Result.success) {
                                    $('#rsaPublicKey').val(y9Result.data);
                                }
                            }
                        })
                ).done(function () {
                    // 下拉框选择的租户存储到 cookie 中
                    $.cookie("tenantShortName", tenantShortName, {
                        expires: 365
                    });
                    
                    // 点选验证码
                    $("#mpanel6").pointsVerify({
                        success: function () {
                            option.type = "success";
                            option.content = "登录中···";
                            WfMsg(option);

                            var username = $("#username").val();
                            var password = $("#password").val();
                            var rsaPublicKey = $("#rsaPublicKey").val();

                            //var encodeUsername = encode64(username);
                            //var encodePassword = encode64(password);
                            var encryptedUserName = rsaEncrypt(rsaPublicKey, username);
                            var encryptedPassword = rsaEncrypt(rsaPublicKey, password);
                            $("#username1").val(encryptedUserName);
                            $("#password1").val(encryptedPassword);
                            $("#fm1").submit();
                        },
                        error: function () {
                            option.type = "err";
                            option.content = "请按照顺序点击文字";
                            WfMsg(option);
                            // $(".verify-refresh").click();
                        },
                    });

                }).fail(function () {
                    option.type = "warn";
                    option.content = "获取随机数失败。";
                    WfMsg(option);
                });
            }
        });
    });
</script>

<script type="text/javascript">
    let changeLoginModuleTimer = null;

    function changeLoginModule(value) {
        $("body .toolTips").hide();
        if (changeLoginModuleTimer) {
            clearTimeout(changeLoginModuleTimer);
        }

        if (0 == value) {
            document.getElementById("tunnel").animate(
                    [{transform: "rotateY(0)"}, {transform: "rotateY(360deg)"}],
                    {
                        duration: 850,
                        timingFunction: "ease",
                    }
            );
            document.getElementsByClassName("login_fields")[0].style.display = "none";
        } else {
            document.getElementById("tunnel").animate(
                    [{transform: "rotateY(360deg)"}, {transform: "rotateY(0)"}],
                    {
                        duration: 850,
                        timingFunction: "ease",
                    }
            );
        }
        changeLoginModuleTimer = setTimeout(() => {
            $.cookie("loginModuleTip", value, {
                expires: 365
            });
            if (0 == value) {
                stopQRCodePolling();
                layui.use('layer', function () {
                    var layer = layui.layer;
                    layer.closeAll();
                });
                $("body .login_title").children().eq(0).html("关联系统登录");
                $("body .login_title").children().eq(0).removeAttr("onclick");
                $("body .login_title").attr({style: "justify-content: center;"});
                $("body .login_title").children().eq(1).attr({style: "display: none;"});
                $("body .login_title").children().eq(2).attr({style: "display: none;"});
                $(".disclaimer").children().eq(0).hide();
                $(".disclaimer").children().eq(1).show();
                $(".linkOtherSystem").attr({style: "display: flex;"});
                $("body .qvcode").attr({style: "display: none;"});
            } else {
                changeLoginType($.cookie("loginTip"));
                $("body .login_title").children().eq(0).html("用户登录");
                $("body .login_title").children().eq(0).attr("onclick", "changeLoginType(0);");
                $("body .login_title").attr({style: "justify-content: space-between;"});
                $("body .login_title").children().eq(0).attr({style: "color: #4FA1D9;"});
                $("body .login_title").children().eq(1).attr({style: "display: '';"});
                $("body .login_title").children().eq(2).attr({style: "display: '';"});
                $(".disclaimer").children().eq(0).show();
                $(".disclaimer").children().eq(1).hide();
                //document.getElementsByClassName("login_fields")[0].style.display ="";
                document.getElementsByClassName("linkOtherSystem")[0].style.display = "none";
            }
        }, 530);
    }

    function changeLoginType(value) {
        if (1 == value) {
            //扫码登录
            startQRCodePolling();
            $("body .login_fields").attr({style: "display: none;"});
            $("body .qvcode").fadeIn();
            $("body .login_title").children().eq(0).attr({style: "color: #DFDFDF"});
            $("body .login_title").children().eq(2).attr({style: "color: #4FA1D9"});
        } else {
            //用户名密码登录
            stopQRCodePolling();
            layui.use('layer', function () {
                var layer = layui.layer;
                layer.closeAll();
            });
            $("body .qvcode").attr({style: "display: none;"});
            $("body .login_fields").fadeIn();
            $("body .login_title").children().eq(2).attr({style: "color: #DFDFDF"});
            $("body .login_title").children().eq(0).attr({style: "color: #4FA1D9"});
        }
        $.cookie("loginTip", value, {
            expires: 365
        });
    }

    //获取二维码
    var uuid = "";
    var qrCodePollingSession = null;

    function startQRCodePolling() {
        qrCodePollingSession = {};
        getQRCode(qrCodePollingSession);
    }

    function stopQRCodePolling() {
        qrCodePollingSession = null;
    }

    function getQRCode(session) {
        session = session || qrCodePollingSession;
        if (session === null) {
            return;
        }
        layui.use('layer', function () {
            var layer = layui.layer;
            layer.closeAll();
        });
        $.ajax({
            type: 'POST',
            dataType: 'json',
            url: ctx + '/api/getQRCode',
            success: function (res) {
                if (session !== qrCodePollingSession) {
                    return;
                }
                if (res.success && '' != res.img) {
                    uuid = res.uuid;
                    var imgSrc = res.img;
                    var imgg = "<img src=" + imgSrc + " />";
                    $("#img_container").empty().append(imgg);
                    keepPool(session);
                } else {
                    layer.msg("获取二维码失败，请稍后重试。");
                }
            }
        });
    }

    //轮询二维码是否被扫描被扫描并获取用户ID
    function keepPool(session) {
        if (session !== qrCodePollingSession) {
            return;
        }
        $.ajax({
            type: 'POST',
            dataType: 'json',
            data: {uuid: uuid},
            url: ctx + '/api/getScanResult',
            success: function (res) {
                if (session !== qrCodePollingSession) {
                    return;
                }
                var scanResult = res.scanResult;
                if (scanResult == '1' || scanResult == 1) {
                    stopQRCodePolling();
                    layer.msg("扫描成功，正在登录。");
                    var userId = res.userId;
                    $('#tenantShortName').val(encode64(userId));
                    $("#username1").val(encode64(userId));
                    $("#password1").val(encode64(userId));
                    $("#loginType").val('qrCode');
                    $("#fm1").submit();
                } else if (scanResult == '0' || scanResult == 0) {
                    if ($.cookie("loginTip") == 1 && $.cookie("loginModuleTip") != 0) {
                        layer.msg("该二维码已经失效，请点击该二维码重新获取。", {time: '-1'});
                    }
                } else {
                    setTimeout(function () {
                        keepPool(session);
                    }, 2000);
                }
            }
        });
    }
</script>
</body>
